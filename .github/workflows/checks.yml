# Checks links, skill frontmatter, and blocked terms on every push and pull request.
# Set the repository secret BLOCKED_TERMS to a comma-separated list of terms
# that must not appear in the repository. The check fails when the secret is
# missing. GitHub does not pass secrets to pull requests from forks, so those
# runs give a warning instead, and a maintainer runs the check before merging.
name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links, skills, and blocked terms
        env:
          BLOCKED_TERMS: ${{ secrets.BLOCKED_TERMS }}
          FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: python3 scripts/check_repo.py
